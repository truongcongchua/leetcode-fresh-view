<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>LeetCode Fresh View</title></head>
<body>
  <header><div class="brand-icon" aria-hidden="true">↗</div><div><h1>Fresh View</h1><p class="subtitle">Một góc nhìn mới cho mỗi bài tập.</p></div></header>
  <main>
    <p class="eyebrow">CHẾ ĐỘ LUYỆN TẬP <span>LEETCODE</span></p>
    <section class="settings" aria-label="Tùy chọn hiển thị">
      <label><span class="copy"><span class="label-title">Ẩn trạng thái đã giải</span><span class="description" id="solvedHelp">Che nhãn Solved và dấu tích.</span></span><input id="hideSolved" aria-describedby="solvedHelp" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
      <label><span class="copy"><span class="label-title">Ẩn độ khó</span><span class="description" id="difficultyHelp">Che nhãn Easy, Medium và Hard.</span></span><input id="hideDifficulty" aria-describedby="difficultyHelp" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
      <label><span class="copy"><span class="label-title">Ẩn tab Submissions</span><span class="description" id="submissionsHelp">Ẩn lối mở lịch sử nộp bài.</span></span><input id="hideSubmissions" aria-describedby="submissionsHelp" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
    </section>
    <p id="status" role="status" aria-live="polite">Cài đặt được lưu tự động.</p>
  </main>
  <footer><span class="site-dot" aria-hidden="true"></span>leetcode.com<span class="version">v1.4.0</span></footer>
  <script src="popup.js"></script>
</body>
</html>
